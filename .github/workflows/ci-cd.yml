name: CI/CD - .NET ForgeMaster

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read
  deployments: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Run tests and generate report
      run: dotnet test --logger trx --results-directory "TestResults" || true 

    - name: Upload test report (TRX)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: TestResults/**/*.trx

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build project
      run: dotnet publish -c Release -o dist
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: dist

  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: app-build
        path: ./artifact
        
    - name: Simulate deploy
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        echo "Deploying to ${{ github.environment }} with token prefix: ${DEPLOY_TOKEN:0:4}****"
        ls -la ./artifact
        echo "Deploy success"